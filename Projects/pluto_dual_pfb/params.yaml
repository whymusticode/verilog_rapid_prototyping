# The rapid-prototyping harness uses N as the AXI frame length.
# One frame is one critically sampled PFB transform.
part: xc7z010clg400-1
bits: 16
N: 64
rx_count: 2
taps_per_phase: 4
coefficient_bits: 18
kaiser_beta: 7.8562
target:
  # One PFB frame arrives every 64 / 25.6 MS/s = 2.5 us.  The implementation
  # must therefore sustain one complete dual-RX transform in this budget.
  frequency: 200000000
  cycles: 500
